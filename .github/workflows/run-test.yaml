name: Run tests

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest selector forwarded to tox posargs"
        required: false
        default: ""

jobs:
  run-test:
    name: ${{ matrix.python-version }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # run this job using this matrix
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        python-version:
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"

        exclude:
          # beaker raises warning on 3.10. only windows seems affected
          # See https://github.com/bbangert/beaker/pull/213
          - os: "windows-latest"
            python-version: "3.10"

      fail-fast: false

    # steps to run in each job. Some are github actions, others run shell commands
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Set up python
        if: ${{ !(runner.os == 'macOS' && matrix.python-version == '3.7') }}
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          cache-build: true
          allow-build: allow

      # No CPython 3.7 build runs on arm64 macOS (setup-python's x64 build needs
      # Homebrew's x64 gettext); python.org's self-contained x64 installer runs under Rosetta
      - name: Set up python 3.7 (macOS, python.org installer)
        if: ${{ runner.os == 'macOS' && matrix.python-version == '3.7' }}
        run: |
          curl -sSfLo "$RUNNER_TEMP/python-3.7.9.pkg" https://www.python.org/ftp/python/3.7.9/python-3.7.9-macosx10.9.pkg
          sudo installer -pkg "$RUNNER_TEMP/python-3.7.9.pkg" -target /
          PYBIN=/Library/Frameworks/Python.framework/Versions/3.7/bin
          mkdir -p "$RUNNER_TEMP/py37"
          ln -sf "$PYBIN/python3" "$RUNNER_TEMP/py37/python"
          ln -sf "$PYBIN/pip3" "$RUNNER_TEMP/py37/pip"
          echo "$PYBIN" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/py37" >> "$GITHUB_PATH"
          "$PYBIN/python3" --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade tox setuptools
          pip list

      - name: Run tests
        shell: bash
        run: |
          # Pygments >= 2.20 changed its HTML output, breaking test_exceptions; keep the release-era series
          echo "pygments<2.20" > "${RUNNER_TEMP}/test-constraints.txt"
          PIP_CONSTRAINT="${RUNNER_TEMP}/test-constraints.txt" tox -- ${{ inputs.test-filter }}

      - name: Build sdist and wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        run: |
          python -m pip install --index-url 'https://:2022-11-15T14:37:53.675556Z@time-machines-pypi.sealsecurity.io/' build "setuptools<66" wheel==0.38.4
          # release builds drop the dev tag from [egg_info] tag_build
          sed -i 's/^tag_build = dev$/tag_build =/' setup.cfg
          python -m build --no-isolation
          ls -l dist

      - name: Upload artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
